services:
  frontend_dev:
    image: node:24-alpine
    container_name: frontend_dev_ag
    restart: always
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3000"